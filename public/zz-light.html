<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#888}iframe{border:0;display:block;margin:0;background:#fff}</style></head>
<body><script>
var q = new URLSearchParams(location.search);
try { localStorage.setItem('algoflow.theme', q.get('t') || 'light'); } catch (e) {}
var f = document.createElement('iframe');
f.style.width = (q.get('w') || '1280') + 'px';
f.style.height = (q.get('h') || '1700') + 'px';
f.style.marginTop = '-' + (q.get('y') || '0') + 'px';
f.src = q.get('r') || '/';
document.body.appendChild(f);
</script></body></html>
