<!doctype html><html><head><meta charset="utf-8"><title>dbg</title></head><body><pre id="r"></pre>
<script>
const f = document.createElement('iframe'); f.style.cssText = 'position:absolute;left:0;top:0;width:390px;height:844px;border:0';
const t0 = performance.now();
f.src = new URLSearchParams(location.search).get('u') || '/patterns/sliding-window-fixed?ex=1';
document.body.appendChild(f);
let k = 0;
const iv = setInterval(() => {
  k++;
  try {
    const d = f.contentDocument, w = f.contentWindow;
    const res = w.performance.getEntriesByType('resource').map((e) => e.name.replace(location.origin, '') + ':' + Math.round(e.duration));
    console.log('ZZRES ' + JSON.stringify({ t: Math.round(performance.now() - t0), n: res.length, last: res.slice(-3), vis: w.document.visibilityState, html: k === 3 ? d.documentElement.outerHTML.slice(0, 1300) : '' }));
  } catch (e) { console.log('ZZRES err ' + e.message); }
  if (k > 5) { clearInterval(iv); console.log('ZZDONE'); }
}, 1000);
</script></body></html>
